spring:
  application:
    name: admin-server
  config:
    import: optional:configserver:http://localhost:8888
  boot:
    admin:
      # UI + API at root so http://localhost:8090 works in the browser
      # (do NOT set context-path:/admin — that makes / return 404)
      discovery:
        enabled: true

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      management.context-path: /actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: admin-server
    description: Spring Boot Admin UI for monitoring microservices
    version: 1.0.0
