# Temporary local demo profile when MySQL credentials are unavailable.
# Start with: --spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:mem:product_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
